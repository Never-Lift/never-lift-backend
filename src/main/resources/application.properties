spring.application.name=never-lift-backend
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}

# Production uses PostgreSQL through DATABASE_URL. The in-memory fallback keeps
# the empty foundation runnable before a developer provisions a local database.
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:never_lift;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.version=${APP_VERSION:@project.version@}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
