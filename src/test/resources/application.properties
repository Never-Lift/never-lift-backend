app.jwt.secret=test-only-jwt-secret-with-at-least-thirty-two-bytes
app.jwt.expiration-seconds=3600
app.jwt.issuer=never-lift-backend
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
spring.datasource.url=jdbc:h2:mem:never_lift_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
