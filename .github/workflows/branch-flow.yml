name: Branch flow policy

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  validate-source-branch:
    name: Validate source branch
    runs-on: ubuntu-latest
    steps:
      - name: Enforce branch promotion flow
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [[ "$BASE_BRANCH" == "main" && "$HEAD_BRANCH" != "develop" ]]; then
            echo "Pull requests to main must come from develop."
            exit 1
          fi

          if [[ "$BASE_BRANCH" == "develop" && "$HEAD_BRANCH" == "main" ]]; then
            echo "Pull requests from main back to develop are not allowed."
            exit 1
          fi

          echo "Allowed promotion: $HEAD_BRANCH -> $BASE_BRANCH"
