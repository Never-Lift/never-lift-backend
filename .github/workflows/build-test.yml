name: Build and test

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Maven build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: ./mvnw --batch-mode test

      - name: Set up reference tooling runtime
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Test reference portability checks
        run: node --test tools/physics-parity/reference-support.test.mjs tools/physics-parity/compare-reference.test.mjs

      - name: Package application
        run: ./mvnw --batch-mode package
